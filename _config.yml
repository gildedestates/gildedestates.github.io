# =============================================================================
# SITE CONFIG
# =============================================================================
# HOW TO EXTEND (details in README.md)
#
#   Add an agent .............. create  _agents/first-last.md
#   Add a listing ............. create  _listings/street-address.md
#   Add a neighborhood ........ create  _neighborhoods/name.md
#   Add a blog post ........... create  _posts/YYYY-MM-DD-title.md
#   Add / reorder nav links ... edit    `nav:` below
#   Brokerage details ......... edit    _data/brokerage.yml  (DRE #, address, phone, CTA copy)
#   Testimonials .............. edit    _data/testimonials.yml
#   Listing filter options .... edit    _data/filters.yml
#   Colors, type, spacing ..... edit    _sass/_variables.scss  (+ `fonts_url` below)
#
# Rule of thumb: layouts and includes contain NO content. Words live in front
# matter, _data/, or collection files. Adding something should mean adding a file.
#
# NOTE: edits to _config.yml need a restart of `jekyll serve`. Edits to
# _data/ and content files rebuild automatically.
# =============================================================================

# --- Identity ----------------------------------------------------------------
title: Gilded Estates                  # PLACEHOLDER brokerage name (shown as the wordmark)
tagline: California Real Estate Agents
description: >-
  California Real Estate agents representing a select number of buyers and
  sellers with senior-level attention from first conversation to close.
lang: en-US
timezone: America/Los_Angeles

# --- URLs --------------------------------------------------------------------
# Custom domain or <user>.github.io  ->  baseurl: ""
# Project site (<user>.github.io/repo) -> baseurl: "/repo"
url: "https://gildedestates.com"              # production URL, no trailing slash
baseurl: ""

# Posts live under /journal/. Pages and collections set their own permalinks.
permalink: /journal/:title/

# --- Navigation --------------------------------------------------------------
# `cta: true` renders the item as a button. Order here = order on the site.
# To show the blog, uncomment Journal and add a post.
nav:
  - { label: Listings,      url: /listings/ }
  - { label: Neighborhoods, url: /neighborhoods/ }
  - { label: Team,          url: /agents/ }
  - { label: About,         url: /about/ }
  # - { label: Journal,     url: /journal/ }
  - { label: Contact,       url: /contact/, cta: true }

# --- Social ------------------------------------------------------------------
# Shown in the footer and used as `sameAs` in the RealEstateAgent JSON-LD.
# (Deliberately NOT named `social`: jekyll-seo-tag reads that key.)
social_links: []
#  - { label: Facebook, url: "https://www.facebook.com/gildedestates" }
#  - { label: LinkedIn,  url: "https://www.linkedin.com/company/yourcompany" }

# --- Contact form ------------------------------------------------------------
# Create a form at https://formspree.io and paste the ID from its endpoint
# (https://formspree.io/f/<ID>). Netlify Forms will NOT work on GitHub Pages.
formspree_id: xrpekgwk

# --- Fonts -------------------------------------------------------------------
# Google Fonts stylesheet URL. Leave empty ("") to use the system-font fallbacks
# only (fastest). For best performance, self-host the .woff2 files instead:
# see README -> "Performance".
fonts_url: "https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Newsreader:opsz,wght@6..72,300..500&display=swap"

# --- Collections -------------------------------------------------------------
# Each collection is a folder of one-file-per-item. Permalinks are set here so
# URLs stay stable even if you rename a layout.
collections:
  agents:
    output: true
    permalink: /agents/:name/
  listings:
    output: true
    permalink: /listings/:name/
  neighborhoods:
    output: true
    permalink: /neighborhoods/:name/

# --- Front-matter defaults ---------------------------------------------------
# Means item files don't need a `layout:` line. More specific scopes win.
defaults:
  - scope: { path: "" }
    values: { image: /assets/img/og-default.png }   # default social-share image
  - scope: { path: "", type: agents }
    values: { layout: agent }
  - scope: { path: "", type: listings }
    values: { layout: listing }
  - scope: { path: "", type: neighborhoods }
    values: { layout: neighborhood }
  - scope: { path: "", type: posts }
    values: { layout: post }

# --- Build -------------------------------------------------------------------
plugins:            # all on the GitHub Pages allow-list
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .github
  - .sass-cache
  - .jekyll-cache
