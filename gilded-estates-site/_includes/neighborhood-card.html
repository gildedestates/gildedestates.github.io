{%- comment -%} Param: neighborhood (a document from site.neighborhoods). {%- endcomment -%}
{%- assign nc = include.neighborhood -%}
<article class="card">
  <a class="card__link" href="{{ nc.url | relative_url }}">
    <div class="card__media">
      {% include image.html src=nc.image alt=nc.title fallback="landscape" width=800 height=640 %}
    </div>
    <div class="card__body">
      <h3 class="card__title">{{ nc.title }}</h3>
      <p class="card__text">{{ nc.description }}</p>
    </div>
  </a>
</article>
