{%- comment -%}
  schema.org RealEstateAgent for the brokerage. Loaded on pages with
  `schema: brokerage` in their front matter (home, contact).
  Data comes from _data/brokerage.yml and `social_links` in _config.yml.
{%- endcomment -%}
{%- assign sb = site.data.brokerage -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "RealEstateAgent",
  "@id": {{ '/#brokerage' | absolute_url | jsonify }},
  "name": {{ sb.legal_name | default: site.title | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "description": {{ site.description | strip_newlines | jsonify }},
  "image": {{ '/assets/img/og-default.png' | absolute_url | jsonify }},
  "telephone": {{ sb.phone | jsonify }},
  "email": {{ sb.email | jsonify }},
  "priceRange": {{ sb.price_range | jsonify }},
  "address": {
    "@type": "PostalAddress",
    "streetAddress": {{ sb.address.street | jsonify }},
    "addressLocality": {{ sb.address.city | jsonify }},
    "addressRegion": {{ sb.address.state | jsonify }},
    "postalCode": {{ sb.address.zip | jsonify }},
    "addressCountry": "US"
  },
  "areaServed": {{ sb.areas_served | jsonify }},
  "identifier": {
    "@type": "PropertyValue",
    "propertyID": "California DRE license",
    "value": {{ sb.dre | jsonify }}
  },
  "sameAs": [{% for link in site.social_links %}{{ link.url | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}]
}
</script>
