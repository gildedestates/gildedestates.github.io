---
layout: default
---
{%- comment -%}
  Generic inner page. Front matter used:
    title    (required)   intro   (optional lead paragraph)
    prose: true           wraps the content in the readable-width text style
{%- endcomment -%}
<header class="page-header">
  <div class="container">
    <h1>{{ page.title }}</h1>
    {%- if page.intro %}
    <p class="lead">{{ page.intro }}</p>
    {%- endif %}
  </div>
</header>
<div class="section section--tight">
  <div class="container">
    <div{% if page.prose %} class="prose"{% endif %}>
      {{ content }}
    </div>
  </div>
</div>
